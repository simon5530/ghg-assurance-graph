name: Domain and benchmark tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m ghg_assurance_graph.benchmark
      - run: git diff --exit-code -- benchmark/generated
      - run: uv run ruff check src/ghg_assurance_graph tests examples
      - run: uv run ruff format --check src/ghg_assurance_graph tests examples
      - run: uv run python examples/hand_authored.py
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/test_check_docs.py
      - run: uv run ghgag benchmark run > benchmark-evaluation.json
      - run: uv build
      - run: uv run pip-audit --progress-spinner off
      - name: Full real-company pipeline with socket networking blocked
        run: |
          uv run python scripts/run_public_case.py examples/public_companies/umc_group_2022_2024.json --out artifacts/public-umc
          uv run python scripts/run_public_case.py examples/public_companies/umc_parent_2022_2024.json --out artifacts/public-umc-parent
          uv run python scripts/run_public_case.py examples/public_companies/tsmc_heldout_2023_2024.json --out artifacts/public-tsmc
      - name: Upload complete public-company outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-company-full-run
          path: artifacts/public-*
          if-no-files-found: error
          retention-days: 30
