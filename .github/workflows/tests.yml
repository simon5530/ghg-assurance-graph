name: Phase 1 tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run ruff check src/ghg_assurance_graph tests examples
      - run: uv run ruff format --check src/ghg_assurance_graph tests examples
      - run: uv run python examples/hand_authored.py
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/test_check_docs.py
