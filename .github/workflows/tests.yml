name: Domain and benchmark tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv run python -m ghg_assurance_graph.benchmark
      - run: git diff --exit-code -- benchmark/generated
      - run: uv run ruff check src/ghg_assurance_graph tests examples
      - run: uv run ruff format --check src/ghg_assurance_graph tests examples
      - run: uv run python examples/hand_authored.py
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/test_check_docs.py
      - run: uv run ghgag benchmark run > benchmark-evaluation.json
      - run: uv build
      - name: Fresh locked wheel and byte-identical worked-example replay
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/runtime.txt"
          uv venv --python 3.12.14 "$RUNNER_TEMP/wheel-venv"
          uv pip sync --python "$RUNNER_TEMP/wheel-venv/bin/python" --require-hashes "$RUNNER_TEMP/runtime.txt"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" --no-deps dist/ghg_assurance_graph-0.4.0a1-py3-none-any.whl
          uv run python scripts/run_acme_example.py --python "$RUNNER_TEMP/wheel-venv/bin/python" --out "$RUNNER_TEMP/acme-one"
          uv run python scripts/run_acme_example.py --python "$RUNNER_TEMP/wheel-venv/bin/python" --out "$RUNNER_TEMP/acme-two"
          diff -rq "$RUNNER_TEMP/acme-one" "$RUNNER_TEMP/acme-two"
      - run: uv run pip-audit --progress-spinner off
      - name: Complete synthetic ACME workflow with socket networking blocked
        run: uv run python scripts/run_acme_example.py --out artifacts/acme-worked
      - name: Upload complete synthetic worked example
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acme-worked-example
          path: artifacts/acme-worked
          if-no-files-found: error
          retention-days: 30
