name: Historical v0.3.0a1 release reproduction
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/released-reproduction.yml
      - scripts/reproduce_release.py
      - docs/FRESH_RELEASE_REPRODUCTION.md
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Checkout supplies only the harness, never application code or fixtures.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: scripts/reproduce_release.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Fetch pinned public assets and reproduce in empty environments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/reproduce_release.py --report-dir "$RUNNER_TEMP/release-reproduction"
      - name: Archive evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: released-reproduction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-reproduction
          if-no-files-found: error
          retention-days: 90
