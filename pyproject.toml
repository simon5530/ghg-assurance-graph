[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ghg-assurance-graph"
version = "0.3.0a1"
description = "Offline experimental GHG provenance, selected assurance checks, change attribution and evidence export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.11,<3",
    "pint>=0.24,<1",
    "rdflib>=7.1,<8",
    "pyshacl==0.31.0",
    "rocrate==0.15.1",
]

[project.scripts]
ghgag = "ghg_assurance_graph.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
